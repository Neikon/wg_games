name: Add game from issue

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  add-game:
    # Solo issues con label nuevo-juego y con el marcador del formulario
    if: contains(github.event.issue.labels.*.name, 'nuevo-juego')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Añadir juego desde el issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_PATH: ${{ github.event_path }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: python3 .github/scripts/add_game.py

      - name: Commit y push si hay cambios
        run: |
          if git diff --quiet; then
            echo "Sin cambios, nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json assets/
          git commit -m "feat(games): add $(git diff --cached -- games.json | head -20)"
          git push
